name: b3-review
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: b3_review
      POSTGRES_PASSWORD: b3_review
      POSTGRES_DB: b3_review
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # web/worker restart on their own if postgres is unreachable, but
    # postgres itself won't come back up without this — without it, a crashed
    # postgres means total downtime until someone runs `docker compose up` by hand.
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://b3_review:b3_review@postgres:5432/b3_review?schema=public
      REDIS_URL: redis://redis:6379
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://b3_review:b3_review@postgres:5432/b3_review?schema=public
      REDIS_URL: redis://redis:6379
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY}
      GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    depends_on:
      - postgres
      - redis
    # Without this, a crashed worker container just stays down — nothing is
    # left running BullMQ's own stalled-job detection, so a job the crashed
    # worker had "active" sits stuck forever (maxStalledCount/lockDuration in
    # worker.ts only help once some worker process is alive to check them).
    restart: unless-stopped

volumes:
  postgres-data:

# trigger local bot review
